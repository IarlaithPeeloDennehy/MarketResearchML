# Render Infrastructure-as-Code
# Deploy this repo on Render: https://render.com/docs/infrastructure-as-code
#
# What this creates:
#   - A Python web service running the FastAPI backend (serves the frontend too)
#   - (Database is external: Neon free tier — see DATABASE_URL)
#
# First-time setup:
#   1. Push this file to GitHub
#   2. Go to Render Dashboard → New → Blueprint → select this repo
#   3. Render reads this file and creates everything automatically
#   4. Paste the Neon connection string into DATABASE_URL when prompted
#   5. Run `alembic upgrade head` is handled by the Procfile on every deploy

services:
  - type: web
    name: numrkt-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: sh -c 'if [ -n "$DATABASE_URL" ]; then alembic upgrade head; fi && exec uvicorn main:app --host 0.0.0.0 --port $PORT'
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false        # Neon connection string — set in the Render dashboard, never committed
      - key: FINNHUB_API_KEY
        sync: false        # set in the Render dashboard
      - key: ALLOWED_ORIGINS
        value: ""          # leave blank — same-origin serving means CORS is not needed
      - key: CACHE_DIR
        value: ""          # leave blank to use backend/cache/ (ephemeral on free tier)
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET_KEY
        generateValue: true   # Render generates a random value on first deploy

# Database: hosted on Neon (free tier, no expiry) instead of Render's free
# Postgres, which expires after 30 days. DATABASE_URL above points at it.
